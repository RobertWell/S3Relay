# S3Relay CI (HEL-431). Same shape as mobile-app's pipeline: the tests gate the
# image; CI stops at :SHA; promotion is a reviewed digest pin in ryanlin2-control
# read back from the registry (never :latest, never a locally-built digest).
stages:
  - test
  - build

include: []

variables:
  MAVEN_OPTS: "-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository -Xmx1g -XX:+UseG1GC -Dmaven.wagon.http.readTimeout=600000 -Dmaven.wagon.http.connectionTimeout=60000"
  DOCKER_BUILDKIT: "1"

.maven_cache: &maven_cache
  key: maven-$CI_COMMIT_REF_SLUG
  paths:
    - .m2/repository/
  policy: pull-push

.dind_service: &dind_service
  services:
    - name: docker:27-dind
      alias: docker
      command: ["--dns", "8.8.8.8", "--dns", "8.8.4.4"]
      variables:
        DOCKER_TLS_CERTDIR: ""
  variables:
    DOCKER_HOST: tcp://localhost:2375
    DOCKER_TLS_CERTDIR: ""
    DOCKER_DRIVER: overlay2

default:
  interruptible: true
  retry:
    max: 2
    when:
      - runner_system_failure
      - stuck_or_timeout_failure
      - scheduler_failure

# The 15 tests run against a REAL MinIO (a service container), not a mock and
# not Testcontainers — the mounted-socket API negotiation was unreliable on the
# LAN box, and a service container is what CI does best. No docker needed here.
s3relay-tests:
  stage: test
  image: maven:3.9-eclipse-temurin-21
  timeout: 2h
  services:
    # MinIO stopped publishing container images around 2026-09-30 (Docker Hub minio/minio is gone, quay is 401),
    # so the old service image no longer pulls (pipeline 2724: ErrImagePull NotFound). This is the HEL-614 test
    # image: alpine plus the checksum-verified GitHub release binary, published under our namespace and pinned
    # by digest. S3Relay's 32 tests pass against it (2026-10-25, HEL-718). Recipe, rebuild and the check of the
    # binary inside a published digest: ci/minio-test/Dockerfile. Note: GitLab hands this job's variables
    # (project-level DOCKERHUB_TOKEN included) to services too, so only an image we built and checked belongs here.
    - name: roguerzzz123/minio-test:RELEASE.2025-09-07T16-13-09Z@sha256:7ddc0698071c25ef8be60e0c031969699aa95c373137b93f82409aeb64f5b3c0
      alias: minio
      command: ["server", "/data"]
      variables:
        MINIO_ROOT_USER: s3relaytest
        MINIO_ROOT_PASSWORD: s3relaytestsecret
  variables:
    S3RELAY_TEST_ENDPOINT: "http://minio:9000"
    S3RELAY_TEST_USER: s3relaytest
    S3RELAY_TEST_PASS: s3relaytestsecret
    S3RELAY_TEST_BUCKET: test
  cache:
    - <<: *maven_cache
  script:
    - |
      for i in $(seq 1 60); do
        if curl -sf http://minio:9000/minio/health/live >/dev/null 2>&1; then echo "minio ready"; break; fi
        sleep 2
      done
    # NOT -q: a silent log cannot be diagnosed (see mobile-app's pipeline).
    - mvn -B test
    - |
      # A gate that never ran is not a gate: the wire suite must have executed.
      ran=$(grep -h -o 'tests="[0-9]*"' target/surefire-reports/TEST-com.pkgrove.s3relay.S3RelayTest.xml | head -1 | tr -dc '0-9')
      test "${ran:-0}" -ge 8 || { echo "ERROR: S3RelayTest ran ${ran:-0} tests (expected ≥ 8) — the MinIO-backed suite did not execute"; exit 1; }
      echo "S3RelayTest ran $ran tests against the MinIO service"
  artifacts:
    when: always
    paths:
      - target/surefire-reports/
    reports:
      junit: target/surefire-reports/TEST-*.xml
    expire_in: 7 days
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

build-image-s3relay:
  # HEL-665: one heavy-I/O job (image build / scan / validate) at a time in this project; a job waiting
  # for the group is not running, so its timeout does not tick. Two such jobs overlapping a
  # start-of-job write burst cost the k8s datastore its lease writes (10-31 21:40Z, 11-01 00:03Z).
  resource_group: lan-heavy-io
  stage: build
  image: docker:27
  timeout: 2h
  tags:
    - privileged
  <<: *dind_service
  needs:
    - job: s3relay-tests
  # DOCKERHUB_USERNAME/DOCKERHUB_TOKEN are scoped to this environment (GitLab CI variable
  # environment_scope=dockerhub, set 2026-10-26, HEL-718 review): only jobs that declare it
  # receive them, so the test job and its service containers never see the push token.
  # `action: prepare` records no deployment.
  environment:
    name: dockerhub
    action: prepare
  before_script:
    - |
      for i in $(seq 1 60); do
        if docker info >/dev/null 2>&1; then break; fi
        sleep 2
      done
    - echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
  script:
    - docker build -t "$DOCKERHUB_USERNAME/s3relay:$CI_COMMIT_SHORT_SHA" -f Dockerfile .
    - docker push "$DOCKERHUB_USERNAME/s3relay:$CI_COMMIT_SHORT_SHA"
    - |
      ref="$DOCKERHUB_USERNAME/s3relay:$CI_COMMIT_SHORT_SHA"
      digest=$(docker buildx imagetools inspect "$ref" --format "{{.Manifest.Digest}}" 2>/dev/null || true)
      case "$digest" in
        sha256:*) ;;
        *) digest=$(docker buildx imagetools inspect "$ref" | awk '/^Digest:/ {print $2; exit}') ;;
      esac
      echo "$digest" | grep -Eq '^sha256:[0-9a-f]{64}$' || {
        echo "ERROR: could not read a valid digest back for $ref (got: '$digest')"; exit 1; }
      mkdir -p evidence
      {
        echo "# s3relay image evidence"
        echo "commit=$CI_COMMIT_SHA"
        echo "pipeline=$CI_PIPELINE_URL"
        echo "tag=$ref"
        echo "pin=$DOCKERHUB_USERNAME/s3relay@$digest"
      } | tee evidence/IMAGE.txt
      echo "IMAGE_DIGEST=$digest" > build.env   # HEL-841: cve-scan-artifact scans exactly this digest
  artifacts:
    reports:
      dotenv: build.env
    paths:
      - evidence/
    expire_in: never
  rules:
    # HEL-832: a rebuild on a fresh base without a source change - pipeline variable FORCE_BUILD=all or a list naming
    # this image (the hello-stock / mobile-app / hello-sre knob), from the API or the web UI on main.
    - if: ($CI_PIPELINE_SOURCE == "api" || $CI_PIPELINE_SOURCE == "web") && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && ($FORCE_BUILD == "all" || $FORCE_BUILD =~ /(^|,)s3relay(,|$)/)
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# HEL-841: no credential reaches main. The tree and the FULL history of HEAD go through gitleaks every pipeline
# (a push range misses commits whose pipeline never ran); known findings are exact fingerprints in
# .gitleaksignore, anything else fails, values redacted. A finding is rotated, not ignored.
secret-scan:
  stage: test
  image:
    name: zricethezav/gitleaks:v8.24.3@sha256:e1b35e12a8c6fa8901f060459cfb6b2fc4c484d3afbe3b029733a3bbfab07055
    entrypoint: [""]
  timeout: 10 minutes
  interruptible: false   # a cancelled pipeline must not mean an unscanned push
  variables:
    GIT_STRATEGY: fetch
    GIT_DEPTH: "0"       # the full history is scanned; a shallow clone fails the job
  script:
    - sh scripts/ci/secret-scan.sh
  artifacts:
    when: always
    paths: [gitleaks-report.json, commits-gitleaks-report.json]
    expire_in: 30 days
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - when: on_success

# HEL-841 scope 3: this repo had no vulnerability scan at all (PM inventory 11-11). Same gates as QuerySkiff:
# trivy's DBs come from the hello-sre mirror (pinned HELLO_SRE_REF), fixable HIGH/CRITICAL block, and accepted
# ones go in .trivyignore.yaml with an expiry (the register), so new exposure still fails.
.trivy_dbs_from_mirror: &trivy_dbs_from_mirror
  - |
    set -e
    # Bounded retry (HEL-528 shape): the Alpine CDN index fetch hit a transient DNS error in hello-stock on
    # 2026-10-03 and killed a scan before trivy ran.
    ok=0; for attempt in 1 2 3; do apk add --no-cache -q curl python3 git >/dev/null 2>&1 && { ok=1; break; }; echo "apk attempt $attempt failed - retrying in 15s"; sleep 15; done; [ "$ok" = 1 ] || { echo "ERROR: apk could not install curl/python3/git after 3 attempts"; exit 2; }
    rm -rf hello-sre && git init -q hello-sre && cd hello-sre
    git -c credential.helper='!f() { echo username=gitlab-ci-token; echo "password=$CI_JOB_TOKEN"; }; f' fetch -q --depth 1 "http://gitlab.gitlab.svc.cluster.local/root/hello-sre.git" "$HELLO_SRE_REF"
    git checkout -q FETCH_HEAD; [ "$(git rev-parse HEAD)" = "$HELLO_SRE_REF" ] || { echo "ERROR: hello-sre did not resolve to the pinned $HELLO_SRE_REF"; exit 2; }
    cd "$CI_PROJECT_DIR"
    . hello-sre/scripts/ci/trivy-db-fetch.sh
    if fetch_trivy_dbs 1; then echo "--- trivy DBs from the hello-sre mirror"; echo "TRIVY_SKIP_DB_UPDATE=true" >> trivy-db.env; echo "TRIVY_SKIP_JAVA_DB_UPDATE=true" >> trivy-db.env
    else echo "--- mirror unavailable: trivy downloads its DBs live"; : > trivy-db.env; fi

dep-scan:
  resource_group: lan-heavy-io
  stage: test
  image:
    name: aquasec/trivy:0.71.2
    entrypoint: [""]
  timeout: 60 minutes
  variables:
    TRIVY_DB_REPOSITORY: "public.ecr.aws/aquasecurity/trivy-db:2,ghcr.io/aquasecurity/trivy-db:2"
    TRIVY_CACHE_DIR: $CI_PROJECT_DIR/.trivycache
    TRIVY_TIMEOUT: 40m
    TRIVY_SKIP_VERSION_CHECK: "true"
    HELLO_SRE_REF: "4933c7f46d04563d4521bb69725b53fb8ab49b20"
  cache:
    - key: trivy-dbs-$CI_COMMIT_REF_PROTECTED   # a branch-wide job never writes the cache the main-only gate reads
      paths: [.trivycache]
    # HEL-841 (11-12): trivy resolves the pom's parents/BOMs from ~/.m2 first. Without it every scan asked
    # Maven Central for aws-sdk-java-pom and friends, and Central's 429 IP block failed the gate (job 25992).
    # Read-only here; s3relay-tests on the same ref writes it. A miss falls back to Central, as before.
    - <<: *maven_cache
      policy: pull
  script:
    - *trivy_dbs_from_mirror
    - set -a; . ./trivy-db.env; set +a
    - mkdir -p "$HOME/.m2" && printf '<settings><localRepository>%s</localRepository></settings>\n' "$CI_PROJECT_DIR/.m2/repository" > "$HOME/.m2/settings.xml"
    - echo "=== local Maven repository for trivy - $(find .m2/repository -name '*.pom' 2>/dev/null | wc -l) poms cached"
    - echo "=== dependency scan of the source tree (fixable HIGH/CRITICAL block; register .trivyignore.yaml)"
    - trivy fs --scanners vuln --severity HIGH,CRITICAL --exit-code 0 --format json --output dep-scan.json --skip-dirs hello-sre --skip-dirs .m2 .
    - trivy fs --scanners vuln --severity HIGH,CRITICAL --exit-code 1 --ignore-unfixed --ignorefile .trivyignore.yaml --skip-dirs hello-sre --skip-dirs .m2 --format table .
  artifacts:
    when: always
    paths: [dep-scan.json]
    expire_in: 30 days
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $CI_COMMIT_BRANCH

# The shipped artefact itself (what the source scan cannot see: the OS layer and what the build pulled in), on
# main after build-image-s3relay, read back through the LAN pull-through cache.
cve-scan-artifact:
  resource_group: lan-heavy-io
  stage: build
  image:
    name: aquasec/trivy:0.71.2
    entrypoint: [""]
  timeout: 60 minutes
  needs:
    - job: build-image-s3relay
      optional: true
  variables:
    TRIVY_DB_REPOSITORY: "public.ecr.aws/aquasecurity/trivy-db:2,ghcr.io/aquasecurity/trivy-db:2"
    TRIVY_CACHE_DIR: $CI_PROJECT_DIR/.trivycache
    TRIVY_TIMEOUT: 40m
    TRIVY_SKIP_VERSION_CHECK: "true"
    IMAGE_REPO: "roguerzzz123/s3relay"
    MIRROR: "10.152.183.230:5000"
    HELLO_SRE_REF: "4933c7f46d04563d4521bb69725b53fb8ab49b20"
  cache:
    key: trivy-dbs-$CI_COMMIT_REF_PROTECTED   # a branch-wide job never writes the cache the main-only gate reads
    paths: [.trivycache]
  script:
    - *trivy_dbs_from_mirror
    - set -a; . ./trivy-db.env; set +a
    # the digest the build pushed (its dotenv artifact), not a tag: a pull by digest is content-addressed, so the
    # plain-HTTP mirror cannot hand back anything else, and the scan is of the shipped image (security review 11-12)
    - '[ -n "${IMAGE_DIGEST:-}" ] || { echo "no IMAGE_DIGEST from the build job: refusing to scan a tag"; exit 1; }'
    - IMAGE_REF="$IMAGE_REPO@$IMAGE_DIGEST"; echo "=== artefact scan of $IMAGE_REF (via $MIRROR)"
    - trivy image --insecure --scanners vuln --severity HIGH,CRITICAL --exit-code 0 --format json --output artifact-cve.json "$MIRROR/$IMAGE_REF"
    - trivy image --insecure --scanners vuln --severity HIGH,CRITICAL --exit-code 1 --ignore-unfixed --ignorefile .trivyignore.yaml --format table "$MIRROR/$IMAGE_REF"
  artifacts:
    when: always
    paths: [artifact-cve.json]
    expire_in: 30 days
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
