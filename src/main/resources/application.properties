quarkus.http.port=8080
# S3Relay caches large objects; let request bodies stream rather than buffer.
quarkus.http.limits.max-body-size=5G
quarkus.http.body.handle-file-uploads=false

# ── Upstream S3 (authoritative store). NOT MinIO-specific — endpoint, region and
#    credentials are all configurable so MinIO / AWS S3 / R2 / Garage all work. ──
s3relay.upstream.endpoint=${S3RELAY_UPSTREAM_ENDPOINT:http://localhost:9000}
s3relay.upstream.region=${S3RELAY_UPSTREAM_REGION:us-east-1}
s3relay.upstream.access-key=${S3RELAY_UPSTREAM_ACCESS_KEY:}
s3relay.upstream.secret-key=${S3RELAY_UPSTREAM_SECRET_KEY:}
# Path-style is required by MinIO and most self-hosted S3; virtual-host for AWS.
s3relay.upstream.path-style=${S3RELAY_UPSTREAM_PATH_STYLE:true}

# ── Local ephemeral cache (emptyDir at /cache in k8s) ────────────────────────
s3relay.cache.dir=${S3RELAY_CACHE_DIR:/cache}
s3relay.cache.max-bytes=${S3RELAY_CACHE_MAX_BYTES:10737418240}
s3relay.cache.ttl-seconds=${S3RELAY_CACHE_TTL_SECONDS:86400}
# Eviction runs when usage crosses the high watermark, down to the low watermark.
s3relay.cache.high-watermark=${S3RELAY_CACHE_HIGH_WATERMARK:0.90}
s3relay.cache.low-watermark=${S3RELAY_CACHE_LOW_WATERMARK:0.70}

# ── Upstream fault tolerance (SmallRye) ──────────────────────────────────────
# Reads/metadata: short, so a stuck upstream cannot hold worker threads.
s3relay.upstream.timeout-ms=${S3RELAY_UPSTREAM_TIMEOUT_MS:8000}
# PUT (and the full-object download on a cache miss): long — a 454 MB object cannot
# arrive in 8 s, and a PUT timed out mid-flight is the "pinned forever" failure of
# HEL-452. These values are ALSO the SDK's per-call deadlines (S3ObjectStorage).
s3relay.upstream.put-timeout-ms=${S3RELAY_UPSTREAM_PUT_TIMEOUT_MS:600000}
# The MicroProfile FT @Timeout values on Upstream come from here, not from code.
com.pkgrove.s3relay.Upstream/getInto/Timeout/value=${S3RELAY_UPSTREAM_PUT_TIMEOUT_MS:600000}
com.pkgrove.s3relay.Upstream/put/Timeout/value=${S3RELAY_UPSTREAM_PUT_TIMEOUT_MS:600000}
com.pkgrove.s3relay.Upstream/head/Timeout/value=${S3RELAY_UPSTREAM_TIMEOUT_MS:8000}
com.pkgrove.s3relay.Upstream/delete/Timeout/value=${S3RELAY_UPSTREAM_TIMEOUT_MS:8000}
com.pkgrove.s3relay.Upstream/list/Timeout/value=${S3RELAY_UPSTREAM_TIMEOUT_MS:8000}
# Tube mode (HEL-460): opening an upstream stream must answer fast; the transfer itself has no deadline.
com.pkgrove.s3relay.Upstream/open/Timeout/value=${S3RELAY_UPSTREAM_TIMEOUT_MS:8000}

quarkus.micrometer.export.prometheus.enabled=true

# dev/test: a throwaway upstream is supplied by the test resource / dev services.
%test.s3relay.cache.max-bytes=2097152
%test.s3relay.upstream.timeout-ms=4000
%test.s3relay.upstream.put-timeout-ms=20000
%test.s3relay.cache.ttl-seconds=3600
